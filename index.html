<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>자원안보 진단·평가 지표 AHP 전문가 설문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0/dotum.min.css">
<style>
  :root{
    --ink:#111; --line:#bfbfbf; --line-dark:#111; --soft:#f2f2f2;
    --green:#3A7D44; --red:#C0504D; --green-bg:#f1f8f2; --red-bg:#fdf3f3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);
    font-family:'KoPubWorld Dotum','KoPubWorldDotum','KoPubWorldDotum Medium','KoPubWorld돋움체 Medium','KoPub Dotum','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    line-height:1.6;font-size:15px}
  a{color:var(--ink)}
  .wrap{max-width:880px;margin:0 auto;padding:28px 16px 80px}
  header{border-bottom:2px solid var(--line-dark);padding-bottom:12px;margin-bottom:14px}
  header .org{font-size:15px;margin:0 0 4px}
  header h1{margin:0;font-size:22px;letter-spacing:-.2px;cursor:pointer;display:inline-block}
  header h1:hover{text-decoration:underline;text-underline-offset:4px}
  .banner{background:var(--soft);border:1px solid var(--line);padding:10px 14px;font-size:15px;margin-bottom:14px}
  /* 현재 평가 광물 띠 (스크롤해도 상단 고정) */
  .mineral-bar{position:sticky;top:0;z-index:10;display:flex;align-items:baseline;gap:14px;background:var(--line-dark);color:#fff;padding:9px 16px;margin:0 0 12px}
  .mineral-bar[hidden]{display:none}
  .mineral-bar .lbl{font-size:15px;opacity:.85}
  .mineral-bar .name{font-size:22px;font-weight:700;letter-spacing:.5px}
  .mineral-bar .name small{font-size:15px;font-weight:400;margin-left:4px;opacity:.85}
  .mineral-bar .save{font-size:14px;opacity:.85;padding:1px 8px;border:1px solid rgba(255,255,255,.5)}
  .mineral-bar .pos{margin-left:auto;font-size:15px;opacity:.85}
  .mineral-bar .inv{margin-left:0}
  .mtag{display:inline-block;background:var(--line-dark);color:#fff;padding:1px 10px;margin-right:6px;font-size:15px;vertical-align:middle}
  .mineral-bar .prog{font-size:15px}
  .mineral-bar .inv{margin-left:auto;background:#fff;color:var(--ink);border-color:#fff}
  .who{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:var(--soft);margin:0 0 14px;font-size:15px}
  /* 광물 선택 카드 */
  .minerals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 12px}
  .mineral{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line-dark);background:#fff;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
  .mineral:hover{background:var(--soft)}
  .mineral .sym{font-size:13px;border:1px solid var(--line);padding:0 6px}
  .mineral .nm{font-size:19px;font-weight:700;margin-top:4px}
  .mineral .st{font-size:14px}
  .mineral .go{font-size:15px;font-weight:700;margin-top:6px}
  .mineral.cur{background:var(--soft)}
  .mineral.done{border-color:var(--line);color:#777;background:#fafafa;cursor:default}
  .mineral.done .nm{color:var(--ink)}
  .steps{display:flex;gap:6px;margin:14px 0 20px;flex-wrap:wrap}
  .steps span{padding:4px 12px;border:1px solid var(--line);font-size:15px;background:#fff;white-space:nowrap}
  .steps span.done{border-color:var(--line-dark)}
  .steps span.active{background:var(--line-dark);color:#fff;border-color:var(--line-dark)}
  .steps span.link{cursor:pointer}
  .steps span.link:hover{border-color:var(--line-dark);background:var(--soft)}
  .steps span.active.link:hover{background:var(--line-dark);color:#fff}
  .steps span.off{border-style:dashed;cursor:default}
  .steps span.sep{border:0;padding:4px 2px;color:var(--line)}
  .card{border:1px solid var(--line);padding:20px 22px;margin-bottom:16px;background:#fff}
  h2{font-size:18px;margin:0 0 10px}
  h3{font-size:15px;margin:18px 0 8px}
  p{margin:0 0 10px}
  .note{font-size:15px}
  .crumb{font-size:15px;margin-bottom:4px}
  /* 계층구조 */
  /* 계층도 */
  .diagram{border:1px solid var(--line);padding:10px 12px;margin:6px 0 12px;background:#fff;overflow-x:auto}
  .diagram svg{display:block}
  .defs{list-style:none;margin:0 0 14px;padding:0;font-size:15px}
  .defs li{margin:0 0 6px;padding-left:1.2em;text-indent:-1.2em}
  .defs li b{font-weight:700}
  /* 표 */
  table{border-collapse:collapse;width:100%;font-size:15px}
  th,td{padding:7px 10px;border:0;text-align:left;vertical-align:middle}
  th{font-weight:700;border-bottom:2px solid var(--line-dark)}
  td.num,th.num{text-align:right;white-space:nowrap}
  tr.area-row td{background:var(--soft);font-weight:700;padding-top:9px;padding-bottom:9px}
  td.sub{padding-left:24px}
  /* 응답자 정보 */
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fields label{display:block;font-size:15px;margin-bottom:4px}
  .fields input{width:100%;padding:8px 10px;border:1px solid var(--line);font:inherit;font-size:15px;color:var(--ink)}
  .fields input:focus{outline:none;border-color:var(--line-dark)}
  /* 쌍대비교 */
  .pairs{border-top:1px solid var(--line-dark);border-bottom:1px solid var(--line-dark)}
  .pair{padding:14px 10px;border-bottom:1px solid var(--line);transition:background .2s}
  .pair:last-child{border-bottom:0}
  .pair.worst{background:var(--red-bg)}
  .pair-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;gap:10px}
  .pair-head .r{text-align:right}
  .scale{padding:8px 0 2px}
  .dirs{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
  .btns{display:flex;border:1px solid var(--line)}
  .btns button{flex:1;height:40px;border:0;background:#fff;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);padding:0}
  .btns button:hover{background:var(--soft)}
  .btns button.eq{background:var(--soft);font-weight:700}
  .btns button.sel{background:var(--line-dark);color:#fff}
  .pair-msg{font-size:15px;min-height:20px;margin-top:6px}
  .worst-note{font-size:15px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--red)}
  /* CR 박스 */
  .cr-box{padding:12px 16px;margin:16px 0 6px;border:1px solid var(--line);background:#fafafa}
  .cr-box.ok{border-color:var(--green);background:var(--green-bg)}
  .cr-box.warn{border-color:var(--line-dark);background:var(--soft)}
  .cr-box.err{border-color:var(--red);background:var(--red-bg)}
  .cr-box.slim{margin:10px 0 0}
  .cr-val{font-weight:700;font-size:15px}
  .cr-msg{font-size:15px;margin-top:4px}
  /* 결과 */
  .bar{height:10px;background:#8fbce6;min-width:2px}   /* 평가영역: 연한 파랑 */
  .bar.g{background:#cfe2f3}                               /* 세부지표: 더 연한 파랑 */
  td.barcell{width:30%}
  pre.json{background:var(--soft);border:1px solid var(--line);padding:12px;font-size:12px;overflow:auto;max-height:360px}
  /* 버튼 */
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
  button.primary{background:var(--line-dark);color:#fff;border:1px solid var(--line-dark);padding:10px 22px;font:inherit;font-size:15px;cursor:pointer}
  button.primary:hover{background:#333}
  button.primary:disabled{background:#c8c8c8;border-color:#c8c8c8;cursor:not-allowed}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line-dark);padding:10px 18px;font:inherit;font-size:15px;cursor:pointer}
  th,td,.pair-head span{word-break:keep-all;overflow-wrap:anywhere}
  button.ghost.small{padding:4px 10px;font-size:14px;margin-left:6px}
  .nav span{display:flex;gap:8px}
  /* 인쇄(PDF)용 */
  .print-sheet{display:none}
  @media print{
    @page{size:A4;margin:16mm}
    body{font-size:11pt}
    header,.steps,.banner,main,.nav{display:none !important}
    .wrap{max-width:none;padding:0}
    .print-sheet{display:block}
    .mineral-bar{display:none !important}
    .print-sheet h1{font-size:16pt;margin:0 0 4px}
    .print-sheet .pmineral{font-size:14pt;margin:6px 0 10px}
    .print-sheet h2{font-size:13pt;margin:16px 0 6px;page-break-after:avoid}
    .print-sheet table{font-size:10.5pt;page-break-inside:auto}
    .print-sheet tr{page-break-inside:avoid}
    .print-sheet th{border-bottom:1.5px solid #000}
    .print-sheet td,.print-sheet th{padding:4px 6px;border-bottom:0.5px solid #bbb}
    .print-sheet table.meta td{border:0;padding:2px 10px 2px 0}
    .print-sheet table.meta td:nth-child(odd){font-weight:700;width:60px}
    .print-sheet tr.area-row td{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .print-sheet .note{font-size:9.5pt;margin-top:10px}
    .print-sheet h3{font-size:11.5pt;margin:14px 0 6px;page-break-after:avoid}
    .print-sheet .crline{font-size:10pt;margin:-4px 0 12px;text-align:right}
    .print-sheet .mblock{page-break-before:always}
    .print-sheet table.wide th.num,.print-sheet table.wide td.num{width:11%}
    .print-sheet table{margin-bottom:10px}
  }
  @media (max-width:600px){
    .wrap{padding:18px 12px 60px}
    .mineral-bar{margin:0 -12px 12px;padding:7px 12px;gap:8px 10px;flex-wrap:wrap}
    .mineral-bar .pos{margin-left:0}
    .mineral-bar .name{font-size:19px}
    .minerals{grid-template-columns:1fr 1fr}
    header h1{font-size:19px}
    .fields{grid-template-columns:1fr}
    .card{padding:14px}
    .diagram{padding:6px 4px}
    .pair{padding:12px 4px}
    .btns button{font-size:15px;height:44px}      /* 손가락으로 누르기 편한 높이 */
    .dirs{font-size:13px}
    /* 결과표: 막대 열은 숨기고, 숫자 머리글은 줄바꿈 허용 */
    table{font-size:14px}
    th,td{padding:6px 5px}
    td.barcell,th.barcell{display:none}
    th.num{white-space:normal}
    td.sub{padding-left:14px}
    .cr-box{padding:10px 12px}
    .nav button{padding:10px 12px}
    .nav span{gap:6px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="org" id="org"></p>
    <h1 id="title" onclick="go(0)" title="안내 화면으로"></h1>
  </header>
  <div class="banner" id="testBanner" hidden>
    <b>테스트 모드</b>: Supabase 주소/키(<code>CONFIG.supabase</code>)가 비어 있어 등록·저장·제출이 이 브라우저 안에서만 흉내 납니다.
  </div>
  <div class="banner" id="connBanner" style="border-color:var(--red);background:var(--red-bg)" hidden></div>
  <div class="mineral-bar" id="mineralBar" hidden></div>
  <nav class="steps" id="steps"></nav>
  <main id="main"></main>
</div>

<script>
/* =====================================================================
 *  설정: 이 블록만 수정하면 설문 내용을 바꿀 수 있습니다
 * ===================================================================== */
const CONFIG = {
  // Supabase 프로젝트 설정. 둘 중 하나라도 비어 있으면 테스트 모드로 동작합니다.
  supabase: {
    url: "https://ocigorjuluhoylpnthbi.supabase.co",   // 반드시 https:// 로 시작 (빠뜨려도 자동 보정됨)
    key: "sb_publishable_nhyra74QzDf3WCkbqZW3LA_sGEd9Tca"   // Project Settings → API Keys 의 publishable 키
  },
  table: "ahp_responses",

  crLimit: 0.2,   // 이 값을 초과하면 오류 → 재검토 요청, 다음 단계 진행 불가
  crWarn:  0.1,   // 이 값을 초과하면 주의 표시 (진행은 가능)
  showHint: true, // CR 초과 시 가장 어긋난 비교를 붉게 표시

  // 5점 척도. Saaty 척도의 다섯 언어적 등급(1·3·5·7·9)을 씁니다.
  // 1~5 정수 척도를 원하면 아래 두 줄을 바꾸세요:
  //   values: [1, 2, 3, 4, 5],
  //   labels: { 1:"동등하게 중요", 2:"약간 더 중요", 3:"더 중요", 4:"매우 더 중요", 5:"절대적으로 더 중요" }
  scale: {
    values: [1, 3, 5, 7, 9],
    labels: { 1:"동등하게 중요", 3:"약간 더 중요", 5:"더 중요", 7:"매우 더 중요", 9:"절대적으로 더 중요" }
  },

  organization: "에너지경제연구원 에너지안보정책연구실",
  title: "자원안보 진단·평가 지표 가중치 산정을 위한 AHP 전문가 설문",

  // 평가 대상 광물. 광물마다 같은 지표 체계로 설문을 한 번씩 하고, 광물별로 따로 제출됩니다.
  minerals: [
    { name: "규소",     symbol: "Si" },
    { name: "마그네슘", symbol: "Mg" },
    { name: "망간",     symbol: "Mn" },
    { name: "몰리브덴", symbol: "Mo" },
    { name: "백금",     symbol: "Pt" }
  ],

  // 두 개의 독립된 계층. 계층 간(안정성 vs 대응력) 비교는 하지 않습니다.
  trees: [
    {
      id: "A", name: "안정성",
      areas: [
        { name: "공급",
          def: "자원의 안정적 확보 가능성을 의미하며, 공급망 차질 발생 가능성과 그 파급효과를 평가",
          items: ["자원자립도", "정치적 안정성", "수입 편향성", "생산 편향성", "국내 공급 인프라 안정성"],
          itemDefs: {
            "자원자립도": "자원의 국내외 자체 생산량이 낮을수록 자원 자립도가 낮고 공급위기 위험 증가",
            "정치적 안정성": "자원 공급국의 정치적 안정성이 낮을수록 공급 위기 위험 증가",
            "수입 편향성": "자원 공급국(수입국)이 다양하고, 특정 국가 의존도가 크지 않을수록 수입 편향성 하락",
            "생산 편향성": "자원 공급국(생산국)이 다양하고, 특정 국가 의존도가 크지 않을수록 생산 편향성 하락",
            "국내 공급 인프라 안정성": "공급인프라가 사고, 테러, 자연재해, 보건위기 등에 취약할 경우 공급중단 가능성이 높아져 공급 위기 위험 증가",
          } },
        { name: "수요",
          def: "국내 경제가 자원 사용 및 수입 의존 구조에 따라 얼마나 취약한지를 의미하며, 위기 발생 시 경제적 파급효과를 평가",
          items: ["수입 안정성", "가격 안정성", "수요산업 규모"],
          itemDefs: {
            "수입 안정성": "자원의 수입액 규모와 변동성이 클수록 위기 발생 시 경제에 미치는 영향이 커져 위기 위험 증가",
            "가격 안정성": "자원 가격 수준과 변동성이 클수록 가격 급등락 가능성이 커져 위기 위험 증가",
            "수요산업 규모": "해당 자원에 대한 수요산업의 매출 규모가 클수록 해당 자원 공급 차질 시 산업 전반에 미치는 경제적 파급효과가 커져 위기 위험 증가",
          } },
        { name: "시스템",
          def: "자원 위기 대응을 뒷받침하는 제도적·정보적 기반을 의미하며, 기반이 미흡할수록 위기 대응 취약성이 높아짐",
          items: ["정보 접근성", "공공정책 및 제도"],
          itemDefs: {
            "정보 접근성": "시장정보 확보·점검 여부에 따라 위기 발생 시 신속 대응 가능성을 평가",
            "공공정책 및 제도": "자원 수급관리, 위기대응체계를 통한 위기 예방 및 대응 체계 정도를 평가",
          } }
      ]
    },
    {
      id: "B", name: "대응력",
      areas: [
        { name: "상시 대응력",
          def: "평시 자원 공급 불안정성에 대비할 수 있는 역량으로, 외교적 협력, 기술적 역량, 제도적 준비 등을 통해 공급망 충격을 지속적으로 흡수·완화하는 능력을 평가",
          items: ["수입원 다변화", "외교 및 국제협력", "자원 R&D", "자원 재활용"],
          itemDefs: {
            "수입원 다변화": "자원 공급국이 다양할수록 특정국에서 발생하는 위기 상황에 대한 상시 대응력이 높음",
            "외교 및 국제협력": "다양한 국제협력 활동 및 외교채널 구축을 통해 위기 발생 시 국제적 협조를 활용한 위기 대응 정도를 판단",
            "자원 R&D": "안정적 공급원 확보를 위한 R&D 투자를 통해 자원 위기에 대응할 수 있는 국가 대응력 판단",
            "자원 재활용": "자원 재활용 및 재자원화율이 높아질수록 자원의 효율적 활용 및 안정적인 공급에 기여",
          } },
        { name: "비상 대응력",
          def: "비상시 즉각적으로 동원 가능한 자원과 수단을 의미하며, 비축·개발 물량, 긴급 조달 능력 등을 통해 공급망 위험 발생 시 즉시 대응할 수 있는 능력을 평가",

/* =====================================================================
 *  AHP 계산 (Saaty 고유벡터법)
 * ===================================================================== */
// === AHP MATH START ===
const RI = {1:0, 2:0, 3:0.58, 4:0.90, 5:1.12, 6:1.24, 7:1.32, 8:1.41, 9:1.45, 10:1.49,
            11:1.51, 12:1.48, 13:1.56, 14:1.57, 15:1.59};

function pairsOf(n){
  const p = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) p.push([i, j]);
  return p;
}

// judgments: { "i-j": a_ij }  (a_ij = 왼쪽/오른쪽 중요도 비율)
function buildMatrix(n, judgments){
  const A = Array.from({length: n}, () => Array(n).fill(1));
  for (const [i, j] of pairsOf(n)){
    const a = judgments[i + "-" + j];
    if (a == null) return null;
    A[i][j] = a; A[j][i] = 1 / a;
  }
  return A;
}

// 거듭제곱법으로 주고유벡터·λmax 계산
function priorityVector(A){
  const n = A.length;
  let w = Array(n).fill(1 / n);
  for (let it = 0; it < 200; it++){
    const Aw = A.map(r => r.reduce((s, a, j) => s + a * w[j], 0));
    const sum = Aw.reduce((a, b) => a + b, 0);
    const w2 = Aw.map(v => v / sum);
    const diff = Math.max(...w2.map((v, i) => Math.abs(v - w[i])));
    w = w2;
    if (diff < 1e-12) break;
  }
  const Aw = A.map(r => r.reduce((s, a, j) => s + a * w[j], 0));
  const lmax = Aw.reduce((s, v, i) => s + v / w[i], 0) / n;
  return { w, lmax };
}

function consistency(A){
  const n = A.length;
  const { w, lmax } = priorityVector(A);
  const CI = n > 2 ? (lmax - n) / (n - 1) : 0;
  const ri = RI[n] || 1.59;
  const CR = n > 2 ? CI / ri : 0;
  return { w, lmax, CI, CR };
}

// 가중치로부터 추정되는 비율과 가장 크게 어긋난 쌍
function worstPair(A, w){
  let worst = null, maxDev = -1;
  for (const [i, j] of pairsOf(A.length)){
    const dev = Math.abs(Math.log(A[i][j]) - Math.log(w[i] / w[j]));
    if (dev > maxDev){ maxDev = dev; worst = [i, j]; }
  }
  return { pair: worst, dev: maxDev };
}
// === AHP MATH END ===

/* =====================================================================

 *  임시저장과 제출은 모두 Supabase 함수(ahp_*)를 통해 사람별로 저장되므로
 *  어느 기기·어느 브라우저에서든 같은 계정으로 이어서 응답할 수 있습니다.
 *  (Supabase 설정이 비어 있는 테스트 모드에서는 이 브라우저 안에서만 흉내 냅니다)

const KEY_BASE = "ahp_" + CONFIG.trees.map(t => t.id + t.areas.length).join("") + "_";
const TOKEN_KEY = KEY_BASE + "token";
// 브라우저에는 로그인 토큰만, 그것도 창을 닫으면 사라지는 sessionStorage 에 둡니다 (닫으면 자동 로그아웃, 새로고침은 유지).
// 응답·진행 상태는 모두 서버에 있고, 브라우저 정보는 수집하지 않습니다.
const ssGet = (k, fb) => { try { return JSON.parse(sessionStorage.getItem(k) || "null") ?? fb; } catch (_) { return fb; } };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
const ssDel = k => { try { sessionStorage.removeItem(k); } catch (_) {} };
// 테스트 모드(Supabase 설정이 비어 있을 때)의 흉내용 저장소만 localStorage 를 씁니다
const lsGet = (k, fb) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? fb; } catch (_) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };

const account = { token: null, name: "", affiliation: "", drafts: {}, done: {} };   // drafts[m] = {answers, started_at, submission_id, updated_at}; done[m] = {...}

// ---- 서버 호출 (Supabase RPC) ----
async function rpc(fn, args, opts){
  if (isTestMode()) return localRpc(fn, args);
  const mode = state.keyMode || "header";
  const res = await fetch(keyedUrl(restUrl() + "rpc/" + fn, mode), {
    method: "POST", headers: keyedHeaders(mode, { "Content-Type": "application/json" }), body: JSON.stringify(args),
    keepalive: !!(opts && opts.keepalive)          // 화면을 떠나는 중에도 전송이 끊기지 않도록
  });
  if (!res.ok){ const d = await readDetail(res); throw new Error(`HTTP ${res.status} ${d}`); }
  return await res.json();
}

// 테스트 모드용 흉내: 이 브라우저의 localStorage 에만 저장
function localRpc(fn, a){
  const db = lsGet(KEY_BASE + "testdb", { users: [], drafts: {}, done: {} });
  const save = () => lsSet(KEY_BASE + "testdb", db);
  const user = t => db.users.find(u => u.token === t);
  const keyOf = n => String(n || "").toLowerCase().replace(/\s+/g, "");
  if (fn === "ahp_enter"){
    const k = keyOf(a.p_name), aff = (a.p_affiliation || "").trim();
    if (k.length < 2) return { ok: false, error: "invalid_name" };
    if (!/^[0-9]{4}$/.test(a.p_password || "")) return { ok: false, error: "pin_format" };
    const same = db.users.filter(u => keyOf(u.name) === k);
    if (!same.length){
      if (aff.length < 2) return { ok: false, error: "need_affiliation" };
      const u = { name: a.p_name.trim(), affiliation: aff, pw: a.p_password, token: "t" + newId() }; db.users.push(u); save();
      return { ok: true, token: u.token, name: u.name, affiliation: u.affiliation, existing: false };
    }
    const u = same.find(u => u.pw === a.p_password); if (!u) return { ok: false, error: "bad_password" };
    if (aff.length >= 2) u.affiliation = aff; save();
    return { ok: true, token: u.token, name: u.name, affiliation: u.affiliation, existing: true };
  }
  if (fn === "ahp_login"){ const u = db.users.find(u => u.name === (a.p_name || "").trim() && u.pw === a.p_password); return u ? { ok: true, token: u.token, name: u.name, affiliation: u.affiliation } : { ok: false, error: "bad_credentials" }; }
  const u = user(a.p_token); if (!u) return { ok: false, error: "invalid_session" };
  const k = u.token;
  if (fn === "ahp_state") return { ok: true, name: u.name, affiliation: u.affiliation, drafts: Object.values(db.drafts[k] || {}), done: Object.values(db.done[k] || {}) };
  if (fn === "ahp_save_draft"){ if ((db.done[k] || {})[a.p_mineral]) return { ok: false, error: "already_submitted" }; (db.drafts[k] = db.drafts[k] || {})[a.p_mineral] = { mineral: a.p_mineral, answers: a.p_answers, started_at: a.p_started_at, submission_id: a.p_submission_id, updated_at: new Date().toISOString() }; save(); return { ok: true }; }
  if (fn === "ahp_submit"){ const m = a.p_row.mineral; if ((db.done[k] || {})[m]) return { ok: true, duplicate: true }; (db.done[k] = db.done[k] || {})[m] = { mineral: m, submission_id: a.p_row.submission_id, submitted_at: new Date().toISOString(), cr: a.p_row.cr, weights: a.p_row.weights, judgments: a.p_row.judgments }; if (db.drafts[k]) delete db.drafts[k][m]; save(); return { ok: true }; }
  if (fn === "ahp_my_responses") return { ok: true, name: u.name, affiliation: u.affiliation, responses: Object.values(db.done[k] || {}) };
  if (fn === "ahp_logout") return { ok: true };
  return { ok: false, error: "unknown" };
}

// 로그인 결과 반영 → 서버 상태 불러오기
async function applyLogin(r){
  account.token = r.token; account.name = r.name; account.affiliation = r.affiliation;
  state.respondent = { name: r.name, affiliation: r.affiliation };
  ssSet(TOKEN_KEY, r.token);
  await refreshState();
}
async function refreshState(){
  const r = await rpc("ahp_state", { p_token: account.token });
  if (!r.ok){ if (r.error === "invalid_session") logout(true); return false; }
  account.name = r.name; account.affiliation = r.affiliation;
  state.respondent = { name: r.name, affiliation: r.affiliation };
  account.drafts = {}; (r.drafts || []).forEach(d => account.drafts[d.mineral] = d);
  account.done = {};   (r.done   || []).forEach(d => account.done[d.mineral] = d);
  return true;
}
async function enter(){
  const g = id => document.getElementById(id);
  const name = g("name").value, aff = g("affiliation").value, pw = g("password").value;
  setAuthMsg("확인 중…");
  try {
    const r = await rpc("ahp_enter", { p_name: name, p_affiliation: aff, p_password: pw });
    if (!r.ok){ setAuthMsg(errText(r.error), true); return; }
    await applyLogin(r);
    const list = LOCKED ? [LOCKED] : MINERALS;
    const inProg = list.find(x => !isDone(x.name) && draftStarted(x.name));
    if (r.existing && inProg){
      // 하던 광물이 있으면 바로 그 단계로 이어서
      state.notice = `${account.name} 님, 다시 오셨군요. 응답하시던 ${inProg.name} 평가를 ${draftProgress(inProg.name) + 1}단계부터 이어서 진행합니다.`;
      startMineral(inProg.name);
      return;
    }
    state.notice = r.existing ? `${account.name} 님, 다시 오셨군요. 이전 응답이 그대로 이어집니다.` : "등록되었습니다. 비밀번호(숫자 4자리)는 다른 기기에서 이어서 응답할 때 필요하니 기억해 두세요.";
    render();
  } catch (e) { setAuthMsg("서버에 연결할 수 없습니다. 네트워크를 확인해 주세요. (" + e.message + ")", true); }
}
async function logoutNow(){ if (savePending){ clearTimeout(saveTimer); await flushDraft(); } await logout(); }
async function logout(silent){
  if (account.token && !silent){ try { await rpc("ahp_logout", { p_token: account.token }); } catch (_) {} }
  account.token = null; account.name = ""; account.affiliation = ""; account.drafts = {}; account.done = {};
  lastSaveText = "";

}
function setAuthMsg(t, err){

// 페이지를 열 때: 저장된 토큰이 있으면 자동 로그인

// ---- 임시저장 (서버) ----
let saveTimer = null, savePending = false, lastSaveText = "";
const hhmm = () => new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
function showSave(short){
  lastSaveText = short;
  const a = document.getElementById("saveState"); if (a) a.textContent = short;
}
function saveDraft(){                    // 응답할 때마다 호출. 0.4초 안에 또 누르면 묶어서 한 번만 전송
  if (!state.mineral || !account.token) return;
  // 화면의 진행 표시는 즉시 갱신 (서버 확인은 뒤따라옴)
  account.drafts[state.mineral] = { mineral: state.mineral, answers: JSON.parse(JSON.stringify(state.answers)),
    started_at: new Date(state.startedAt).toISOString(), submission_id: state.submissionId, updated_at: new Date().toISOString() };
  savePending = true;
  showSave("저장 중…");
  clearTimeout(saveTimer); saveTimer = setTimeout(flushDraft, 400);
}
async function flushDraft(){
  if (!savePending || !state.mineral || !account.token) return;
  savePending = false;
  const m = state.mineral, snap = JSON.parse(JSON.stringify(state.answers));
  try {
    const r = await rpc("ahp_save_draft", { p_token: account.token, p_mineral: m, p_answers: snap,
                                           p_started_at: new Date(state.startedAt).toISOString(), p_submission_id: state.submissionId }, { keepalive: true });
    if (r.ok){ account.drafts[m] = { mineral: m, answers: snap, started_at: new Date(state.startedAt).toISOString(), submission_id: state.submissionId, updated_at: new Date().toISOString() };
               showSave(`자동저장 ${hhmm()}`); }
    else { showSave("저장 실패"); if (r.error === "invalid_session") logout(true), render(); }
  } catch (e) {
    showSave("저장 실패 (네트워크)");
    savePending = true;                  // 다음 응답 때 재시도
  }
}
window.addEventListener("beforeunload", () => { if (savePending) flushDraft(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && savePending) flushDraft(); });

const loadDraft = m => account.drafts[m] || null;
const isDone = m => !!account.done[m];
function draftProgress(m){               // 임시저장본의 완료 단계 수
  const d = loadDraft(m); if (!d) return 0;
  const keep = state.answers; state.answers = Object.assign(blankAnswers(), d.answers); const n = doneCount(); state.answers = keep; return n;
}
function draftStarted(m){                // 임시저장본에 응답이 하나라도 있는가 (단계를 못 끝냈어도 "응답 중")
  const d = loadDraft(m); if (!d) return false;
  return Object.values(d.answers || {}).some(sec => Object.keys(sec || {}).length > 0);
}
const progressText = m => { const n = draftProgress(m); return n ? `응답 중 · ${n}/${N_STEPS}단계 완료` : draftStarted(m) ? "응답 중 · 1단계 진행" : "미응답"; };

// 광물을 골라 설문 시작 (임시저장본이 있으면 이어서)
function startMineral(name){
  if (!mineralByName(name) || isDone(name) || !account.token) return;
  if (state.mineral && state.mineral !== name && savePending) flushDraft();   // 하던 광물은 저장해 두고
  state.mineral = name;
  lastSaveText = "";
  const d = loadDraft(name);
  state.answers = d ? Object.assign(blankAnswers(), d.answers) : blankAnswers();
  state.startedAt = d && d.started_at ? new Date(d.started_at).getTime() : Date.now();
  state.submissionId = d && d.submission_id ? d.submission_id : newId();
  state.step = firstIncomplete() || N_STEPS + 1;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

const secById = id => SECTIONS.find(s => s.id === id);

function sectionResult(sec){
  const n = sec.items.length, J = {};
  for (const [i, j] of pairsOf(n)){
    const a = state.answers[sec.id][i + "-" + j];
    if (!a) return null;
    J[i + "-" + j] = ratioOf(a);
  }
  const A = buildMatrix(n, J);
  const c = consistency(A);
  return { A, ...c, worst: worstPair(A, c.w) };
}

function sectionOK(sec){
  const r = sectionResult(sec);
  return !!r && r.CR <= CONFIG.crLimit;
}

// 완료된 단계 수 / 첫 미완료 단계
const doneCount = () => SECTIONS.filter(sectionOK).length;
const allDone = () => doneCount() === N_STEPS;
const firstIncomplete = () => SECTIONS.findIndex(sec => !sectionOK(sec)) + 1;

function renderMineralBar(){
  const el = $("#mineralBar"), m = mineralByName(state.mineral);

    // 안내 화면: 로그인 상태면 진행 상황 요약을 띠로 표시
    if (state.step === 0 && account.token){
      const list = LOCKED ? [LOCKED] : MINERALS;
      const parts = list.map(x => isDone(x.name) ? `✓ ${x.name}` : draftStarted(x.name) ? `${x.name} 응답 중(${draftProgress(x.name)}/${N_STEPS})` : null).filter(Boolean);
      const inProg = list.find(x => !isDone(x.name) && draftStarted(x.name));

      el.innerHTML = `<span class="lbl">${esc(account.name)} 님 진행 상황</span><span class="prog">${parts.length ? parts.map(esc).join(" · ") : "아직 응답한 광물이 없습니다"}</span>` +
        (inProg ? `<button class="ghost small inv" onclick="startMineral('${esc(inProg.name)}')">${esc(inProg.name)} 이어서 응답 ›</button>` : "");
      return;
    }
    el.hidden = true; return;
  }
  const idx = MINERALS.findIndex(x => x.name === m.name) + 1;

  el.innerHTML = `<span class="lbl">현재 평가 광물</span><span class="name">${esc(m.name)} <small>${esc(m.symbol)}</small></span>

    <span class="pos">${idx} / ${MINERALS.length}</span>

}

function renderSteps(){
  renderMineralBar();
  const chip = (i, label, enabled) => {
    const done = i >= 1 && i <= N_STEPS && sectionOK(SECTIONS[i - 1]);
    const cls = [i === state.step ? "active" : done ? "done" : "", enabled ? "link" : "off"].join(" ").trim();
    const on = enabled ? ` onclick="go(${i})"` : ` title="${state.mineral ? "모든 단계를 완료하면 열립니다" : "먼저 평가할 광물을 선택하세요"}"`;
    return `<span class="${cls}"${on}>${done ? "✓ " : ""}${label}</span>`;
  };
  const nav = !!state.mineral;                      // 광물을 고르기 전에는 안내만
  let html = chip(0, "안내", true);
  let idx = 1;
  for (const t of CONFIG.trees){
    html += `<span class="sep">|</span>`;
    for (let k = 0; k <= t.areas.length; k++, idx++){
      const label = k === 0 ? `${t.name} 영역` : t.areas[k - 1].name;
      html += chip(idx, `${idx}. ${esc(label)}`, nav);
    }
  }
  html += `<span class="sep">|</span>` + chip(N_STEPS + 1, "결과·제출", nav && allDone());
  $("#steps").innerHTML = html;
}

// 계층도 SVG
//   focus = { level:"all" }                  안내 화면: 전체를 또렷하게
//   focus = { level:"area" }                 평가영역 비교 단계: 영역 상자 강조
//   focus = { level:"item", area:"공급" }    세부지표 비교 단계: 해당 영역 경로와 세부지표 강조
function diagramSVG(tree, focus, compact){
  // compact: 폰 화면용 압축 배치 (폭 320px)
  const ROW = compact ? 24 : 28, GAP = 4, H_BOX = ROW - GAP, FS = compact ? 11.5 : 15;
  const col = compact
    ? { t:{x:4,w:54}, a:{x:84,w:82}, i:{x:188,w:130} }
    : { t:{x:8,w:84}, a:{x:150,w:116}, i:{x:324,w:206} };
  const totalRows = tree.areas.reduce((s, a) => s + a.items.length, 0);
  const H = totalRows * ROW + 12, W = col.i.x + col.i.w + 8;
  const INK = "#111", DIM = "#b5b5b5", FILL = "#e9e9e9";
  const all = focus.level === "all";
  const box = (c, y, text, on, strong) =>
    `<rect x="${c.x}" y="${y}" width="${c.w}" height="${H_BOX}" fill="${strong ? FILL : "#fff"}" stroke="${on ? INK : DIM}" stroke-width="${strong ? 1.6 : 1}"/>` +
    `<text x="${c.x + c.w / 2}" y="${y + H_BOX / 2 + (compact ? 4 : 5.5)}" text-anchor="middle" font-size="${FS}" fill="${on ? INK : DIM}"${strong ? ' font-weight="700"' : ""}>${esc(text)}</text>`;
  const line = (x1, y1, x2, y2, on) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${on ? INK : DIM}" stroke-width="1"/>`;

  let g = "", row = 0;
  const centers = [];
  for (const a of tree.areas){
    const onArea = all || focus.level === "area" || focus.area === a.name;
    const itemsOn = all || (focus.level === "item" && focus.area === a.name);
    const strongArea = !all && (focus.level === "area" || focus.area === a.name);
    const strongItems = !all && focus.level === "item" && focus.area === a.name;
    const y0 = 6 + row * ROW, n = a.items.length;
    const yc = y0 + (n * ROW) / 2 - GAP / 2;
    centers.push({ yc, on: onArea });
    const busX = col.a.x + col.a.w + (compact ? 10 : 14);
    const firstC = y0 + H_BOX / 2, lastC = y0 + (n - 1) * ROW + H_BOX / 2;
    g += line(col.a.x + col.a.w, yc, busX, yc, itemsOn);
    if (n > 1) g += line(busX, firstC, busX, lastC, itemsOn);
    a.items.forEach((it, k) => {
      const y = y0 + k * ROW, c = y + H_BOX / 2;
      g += line(busX, c, col.i.x, c, itemsOn);
      g += box(col.i, y, it, itemsOn, strongItems);
    });
    g += box(col.a, yc - H_BOX / 2, a.name, onArea, strongArea);
    row += n;
  }
  const tyc = H / 2 - 3, busX = col.t.x + col.t.w + (compact ? 12 : 16);
  g += line(col.t.x + col.t.w, tyc, busX, tyc, true);
  g += line(busX, centers[0].yc, busX, centers[centers.length - 1].yc, all || focus.level === "area");
  const fc = centers.find(c => c.on);
  if (!all && focus.level === "item" && fc) g += line(busX, Math.min(tyc, fc.yc), busX, Math.max(tyc, fc.yc), true);
  centers.forEach(c => g += line(busX, c.yc, col.a.x, c.yc, c.on));
  g += box(col.t, tyc - H_BOX / 2, tree.name, true, false);
  const W2 = compact ? col.i.x + col.i.w + 4 : W;
  return `<svg viewBox="0 0 ${W2} ${H}" width="${W2}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">${g}</svg>`;
}

const isCompact = () => window.innerWidth < 600;
function diagramHTML(tree, focus){
  return `<div class="diagram" data-tree="${tree.id}" data-focus='${JSON.stringify(focus)}'>${diagramSVG(tree, focus, isCompact())}</div>`;
}
// 화면 폭이 바뀌면(폰 회전 등) 그림만 다시 그림
let lastCompact = isCompact();
window.addEventListener("resize", () => {
  if (isCompact() === lastCompact) return;
  lastCompact = isCompact();
  document.querySelectorAll(".diagram[data-tree]").forEach(el => {
    const tree = CONFIG.trees.find(t => t.id === el.dataset.tree);
    el.innerHTML = diagramSVG(tree, JSON.parse(el.dataset.focus), lastCompact);
  });
});

  const tree = CONFIG.trees.find(t => t.id === sec.tree);

// 전체 결과: 영역 가중치 × 세부지표 가중치 = 종합 가중치
function computeAll(){
  const res = {}; SECTIONS.forEach(s => res[s.id] = sectionResult(s));
  const rows = [];
  for (const t of CONFIG.trees){
    const areaSec = secById(t.id + "0"), ar = res[areaSec.id];
    t.areas.forEach((a, k) => {
      const aw = ar.w[k];
      rows.push({ tree: t.id, tree_name: t.name, level: "area", section_id: areaSec.id, area: a.name, item: a.name,
                  local_w: aw, global_w: aw, cr: ar.CR });
      const sec = secById(`${t.id}${k + 1}`), r = res[sec.id];
      sec.items.forEach((it, i) => rows.push({
        tree: t.id, tree_name: t.name, level: "item", section_id: sec.id, area: a.name, item: it,
        local_w: r.w[i], global_w: aw * r.w[i], cr: r.CR
      }));
    });
  }
  return { res, rows };
}

function renderResults(){
  if (!allDone()){ go(N_STEPS + 1); return ""; }
  const { res, rows } = computeAll();
  const pct = x => (x * 100).toFixed(1) + "%";
  const crCls = cr => cr > CONFIG.crLimit ? "err" : cr > CONFIG.crWarn ? "warn" : "ok";
  const blocks = CONFIG.trees.map(t => {
    const areaSec = secById(t.id + "0");
    let body = "";
    t.areas.forEach((a, k) => {
      const sec = secById(`${t.id}${k + 1}`), r = res[sec.id], aw = res[areaSec.id].w[k];
      body += `<tr class="area-row"><td>${esc(a.name)}</td><td class="num">${pct(aw)}</td><td class="num">${pct(aw)}</td><td class="barcell"><div class="bar" style="width:${pct(aw)}"></div></td><td class="num">${sec.items.length < 3 ? "–" : r.CR.toFixed(3)}</td></tr>`;
      rows.filter(x => x.tree === t.id && x.level === "item" && x.area === a.name).forEach(x => {
        body += `<tr><td class="sub">${esc(x.item)}</td><td class="num">${pct(x.local_w)}</td><td class="num">${pct(x.global_w)}</td><td class="barcell"><div class="bar g" style="width:${pct(x.global_w)}"></div></td><td></td></tr>`;
      });
    });
    return `<section class="card"><h2><span class="mtag">${esc(state.mineral)}</span> ${esc(t.name)}</h2>
      <table><thead><tr><th>평가영역 / 세부지표</th><th class="num">영역 내 가중치</th><th class="num">종합 가중치</th><th class="barcell"></th><th class="num">세부지표 비교 CR</th></tr></thead><tbody>${body}</tbody></table>
      <div class="cr-box ${crCls(res[areaSec.id].CR)} slim"><div class="cr-val">평가영역 비교 CR = ${res[areaSec.id].CR.toFixed(3)}</div>
        <div class="cr-msg">종합 가중치 = 평가영역 가중치 × 영역 내 세부지표 가중치. ${esc(t.name)} 체계 안에서 세부지표 종합 가중치의 합은 100%입니다.</div></div>
      </section>`;
  }).join("");
  const testNote = isTestMode() ? `<p class="note">테스트 모드: Supabase 설정이 비어 있어 제출이 이 브라우저 안에만 기록됩니다.</p>` : "";
  return `${blocks}
  <section class="card">
    <h2><span class="mtag">${esc(state.mineral)}</span> 제출</h2>
    <p>위 가중치는 <b>${esc(state.mineral)}</b>에 대해 응답하신 쌍대비교로부터 산출된 값입니다. 확인 후 제출해 주세요.
       모든 광물의 평가를 마치면 전체 응답을 PDF 한 부로 저장할 수 있습니다.</p>
    ${testNote}
    <div class="nav">
      <button class="ghost" onclick="go(${N_STEPS})">이전</button>
      <button class="primary" id="submitBtn" onclick="submitAll()">제출</button>
    </div>
    <div id="submitMsg"></div>
  </section>`;
}

// ---- 전체 응답 PDF (모든 광물 제출 후) ----
// 서버에서 본인이 제출한 응답을 모두 받아 한 문서로 만듭니다: 요약표(지표 × 광물) + 광물별 가중치·쌍대비교
const allMineralsDone = () => (LOCKED ? [LOCKED] : MINERALS).every(x => isDone(x.name));

function printAllHTML(data){
  const pct = x => (x * 100).toFixed(1) + "%";
  const list = (LOCKED ? [LOCKED] : MINERALS).map(x => x.name);
  const byM = {}; (data.responses || []).forEach(r => byM[r.mineral] = r);
  const present = list.filter(m => byM[m]);
  const wOf = (r, tree, level, area, item) => (r.weights || []).find(w => w.tree === tree && w.level === level && w.area === area && w.item === item);
  const when = new Date().toLocaleString("ko-KR");
  let html = `<div class="print-sheet">
    <h1>${esc(CONFIG.title)}</h1>
    <p>${esc(CONFIG.organization)}</p>
    <table class="meta"><tr><td>소속</td><td>${esc(data.affiliation || "")}</td><td>이름</td><td>${esc(data.name || "")}</td></tr>
    <tr><td>평가 광물</td><td>${present.map(esc).join(" · ")} (${present.length}종)</td><td>출력 시각</td><td>${esc(when)}</td></tr></table>`;

  // 1) 요약: 지표 × 광물 종합 가중치
  html += `<h2>요약: 광물별 종합 가중치</h2>`;
  for (const t of CONFIG.trees){
    html += `<table class="wide"><thead><tr><th>${esc(t.name)} 평가영역 / 세부지표</th>${present.map(m => `<th class="num">${esc(m)}</th>`).join("")}</tr></thead><tbody>`;
    for (const a of t.areas){
      html += `<tr class="area-row"><td>${esc(a.name)}</td>${present.map(m => { const w = wOf(byM[m], t.id, "area", a.name, a.name); return `<td class="num">${w ? pct(w.global_w) : "–"}</td>`; }).join("")}</tr>`;
      for (const it of a.items)
        html += `<tr><td class="sub">${esc(it)}</td>${present.map(m => { const w = wOf(byM[m], t.id, "item", a.name, it); return `<td class="num">${w ? pct(w.global_w) : "–"}</td>`; }).join("")}</tr>`;
    }
    html += `</tbody></table>`;
  }
  html += `<p class="note">종합 가중치 = 평가영역 가중치 × 영역 내 세부지표 가중치. 각 광물·각 체계(안정성/대응력) 안에서 세부지표 종합 가중치의 합은 100%입니다.</p>`;

  // 2) 광물별 상세: 가중치 + 쌍대비교
  for (const m of present){
    const r = byM[m], cr = r.cr || {};
    html += `<div class="mblock"><h2>${esc(m)}</h2>`;
    const crTxt = (id, n) => n < 3 ? "–" : (cr[id] != null ? Number(cr[id]).toFixed(3) : "");
    for (const t of CONFIG.trees){
      html += `<table><thead><tr><th>${esc(t.name)} 평가영역 / 세부지표</th><th class="num">영역 내 가중치</th><th class="num">종합 가중치</th><th class="num">세부지표 비교 CR</th></tr></thead><tbody>`;
      t.areas.forEach((a, k) => {
        const aw = wOf(r, t.id, "area", a.name, a.name);
        html += `<tr class="area-row"><td>${esc(a.name)}</td><td class="num">${aw ? pct(aw.local_w) : "–"}</td><td class="num">${aw ? pct(aw.global_w) : "–"}</td><td class="num">${crTxt(t.id + (k + 1), a.items.length)}</td></tr>`;
        a.items.forEach(it => { const w = wOf(r, t.id, "item", a.name, it);
          html += `<tr><td class="sub">${esc(it)}</td><td class="num">${w ? pct(w.local_w) : "–"}</td><td class="num">${w ? pct(w.global_w) : "–"}</td><td class="num"></td></tr>`; });
      });
      html += `</tbody></table><p class="crline">${esc(t.name)} 평가영역 비교 CR = ${crTxt(t.id + "0", t.areas.length)}</p>`;
    }
    html += `<h3>${esc(m)}: 쌍대비교 응답</h3><table><thead><tr><th>단계</th><th>왼쪽 항목</th><th class="num">선택</th><th>오른쪽 항목</th></tr></thead><tbody>`;
    for (const j of (r.judgments || [])){
      const c = String(j.choice || ""); const choice = c === "1" ? "1 (동등)" : c[0] === "L" ? `◀ ${c.slice(1)}` : c[0] === "R" ? `${c.slice(1)} ▶` : c;
      html += `<tr><td>${esc(j.section || j.section_id || "")}</td><td>${esc(j.left_item)}</td><td class="num">${esc(choice)}</td><td>${esc(j.right_item)}</td></tr>`;
    }
    html += `</tbody></table></div>`;
  }
  html += `<p class="note">◀ n: 왼쪽 항목이 n만큼 더 중요 / n ▶: 오른쪽 항목이 n만큼 더 중요.
    CR(일관성 비율)은 지표 하나가 아니라 비교 단계 하나(영역 비교, 또는 한 영역의 세부지표 비교)에 대해 계산되며, 항목이 2개인 영역은 계산 대상이 아닙니다(–). 이 문서는 응답자 보관용입니다.</p></div>`;
  return html;
}

async function printAllPDF(btn){
  if (!account.token) return;
  if (btn){ btn.disabled = true; btn.textContent = "응답을 불러오는 중…"; }
  try {
    const data = await rpc("ahp_my_responses", { p_token: account.token });
    if (!data.ok) throw new Error(errText(data.error));
    let box = document.getElementById("printAll");
    if (!box){ box = document.createElement("div"); box.id = "printAll"; document.body.appendChild(box); }
    box.innerHTML = printAllHTML(data);
    document.title = `AHP응답_전체_${(account.name || "응답자")}`;
    window.print();
    setTimeout(() => { document.title = CONFIG.title; }, 1000);
  } catch (e) {
    alert("응답을 불러오지 못했습니다: " + (e.message || e));
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = "전체 응답 PDF로 저장"; }
  }
}

function renderDone(res){
  const m = state.mineral;
  account.done[m] = { mineral: m, submission_id: state.submissionId, submitted_at: new Date().toISOString() };
  delete account.drafts[m];
  const list = LOCKED ? [LOCKED] : MINERALS;
  const remaining = list.filter(x => !isDone(x.name) && x.name !== m);
  const next = remaining.length
    ? `<h3>다음 광물 평가</h3>
       <p>아직 평가하지 않은 광물: <b>${remaining.map(x => esc(x.name)).join(" · ")}</b>. 지금 이어서 하셔도 되고, 나중에 같은 링크로 다시 오셔도 됩니다.</p>
       <div class="minerals">${remaining.map(x => `<button type="button" class="mineral" onclick="startMineral('${esc(x.name)}')">
         <span class="sym">${esc(x.symbol)}</span><span class="nm">${esc(x.name)}</span><span class="st">${progressText(x.name)}</span><span class="go">${draftStarted(x.name) ? "이어서 응답" : "평가 시작"} ›</span></button>`).join("")}</div>`
    : `<div class="cr-box ok slim"><div class="cr-val">모든 광물(${list.length}종)의 평가가 제출되었습니다.</div>
         <div class="cr-msg">설문에 참여해 주셔서 감사합니다. 아래 버튼으로 전체 응답(요약표 + 광물별 가중치·쌍대비교)을 PDF 한 부로 저장해 두실 수 있습니다.
           나중에 같은 링크로 로그인해서 받으셔도 됩니다.</div>
         <p style="margin:10px 0 0"><button class="primary" onclick="printAllPDF(this)">전체 응답 PDF로 저장</button></p></div>`;
  $("#main").innerHTML = `<section class="card">
    <h2><span class="mtag">${esc(m)}</span> ${res.test ? "테스트 완료" : "제출 완료"}</h2>
    <p><b>${esc(m)}</b>에 대한 응답이 정상적으로 기록되었습니다.${res.test ? " (테스트 모드: 이 브라우저 안에만 기록)" : ""}</p>
    ${res.duplicate ? `<p class="note">이미 기록된 응답이라 중복 저장하지 않았습니다.</p>` : ""}
    ${next}
  </section>`;
  state.step = N_STEPS + 2;
  state.mineral = null; state.answers = blankAnswers();   // 다음 광물을 고르기 전까지 단계 이동 잠금
  renderSteps();
  $("#mineralBar").hidden = true;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render(){
  renderSteps();
  const m = $("#main"), k = state.step;
  if (k === 0) m.innerHTML = renderIntro();
  else if (k <= N_STEPS){ m.innerHTML = renderSection(k); updateCR(SECTIONS[k - 1]); }
  else m.innerHTML = renderResults();
}

/* =====================================================================
 *  상호작용
 * ===================================================================== */
function readRespondent(){ return !!account.token; }

function go(step){
  if (savePending) flushDraft();                                          // 단계를 옮기기 전에 저장
  if (step > 0 && !state.mineral){ state.step = 0; render(); return; }   // 광물을 먼저 선택
  if (state.step === 0 && step > 0 && !readRespondent()) return;
  if (step > N_STEPS && !allDone()){                   // 결과·제출은 모든 단계 완료 후에만
    const left = N_STEPS - doneCount();
    state.notice = `아직 완료하지 않은 단계가 ${left}개 있습니다. 모든 단계를 완료하면 결과를 확인하고 제출할 수 있습니다.`;
    step = firstIncomplete();
  }
  state.step = step;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function pick(secId, key, side, val){
  state.answers[secId][key] = { side, val };
  const sec = secById(secId);
  const [i, j] = key.split("-").map(Number);
  document.getElementById(`pair-${secId}-${key}`).outerHTML = pairHTML(sec, i, j);
  updateCR(sec);
  saveDraft();
}

function updateCR(sec){
  const box = $("#crbox");
  if (!box) return;
  renderSteps();                                       // 완료 표시(✓) 즉시 갱신
  document.querySelectorAll(".pair.worst").forEach(e => e.classList.remove("worst"));
  document.querySelectorAll(".worst-note").forEach(e => e.remove());

  const total = pairsOf(sec.items.length).length;
  const done = Object.keys(state.answers[sec.id]).length;
  const r = sectionResult(sec);

  if (!r){
    box.className = "cr-box";
    box.innerHTML = `<div class="cr-val">일관성 비율(CR): –</div>
      <div class="cr-msg">${done} / ${total} 쌍 응답 완료. 모든 쌍을 응답하면 자동으로 계산됩니다.</div>`;
    return;
  }
  if (sec.items.length < 3){
    box.className = "cr-box ok";
    box.innerHTML = `<div class="cr-val">✓ 응답 완료</div>
      <div class="cr-msg">항목이 2개인 비교는 일관성 검증 대상이 아닙니다. 이 단계가 완료되었습니다.</div>`;
    return;
  }

  const cr = r.CR;
  if (cr > CONFIG.crLimit){
    box.className = "cr-box err";
    box.innerHTML = `<div class="cr-val">⚠ 일관성 비율(CR) = ${cr.toFixed(3)}: 기준치 ${CONFIG.crLimit} 초과</div>
      <div class="cr-msg">응답 간 논리적 일관성이 낮습니다 (예: A &gt; B, B &gt; C인데 C &gt; A).
        ${CONFIG.showHint ? "붉게 표시된 비교를 중심으로" : "각 비교를"} 다시 검토해 주세요.
        CR이 ${CONFIG.crLimit} 이하가 되어야 이 단계가 완료됩니다.</div>`;
    if (CONFIG.showHint && r.worst.pair){
      const [i, j] = r.worst.pair;
      const pe = document.getElementById(`pair-${sec.id}-${i}-${j}`);
      pe.classList.add("worst");
      pe.insertAdjacentHTML("beforeend",
        `<div class="worst-note">이 비교가 다른 응답들과 가장 크게 어긋납니다.</div>`);
    }
    box.scrollIntoView({ behavior: "smooth", block: "center" });
  } else if (cr > CONFIG.crWarn){
    box.className = "cr-box warn";
    box.innerHTML = `<div class="cr-val">일관성 비율(CR) = ${cr.toFixed(3)}</div>
      <div class="cr-msg">허용범위(≤ ${CONFIG.crLimit}) 안에 있으나 일반적 기준(0.1)보다는 높습니다.
        가능하면 한 번 더 검토해 주세요. 이 단계는 완료되었습니다.</div>`;
  } else {
    box.className = "cr-box ok";
    box.innerHTML = `<div class="cr-val">✓ 일관성 비율(CR) = ${cr.toFixed(3)}</div>
      <div class="cr-msg">응답의 일관성이 양호합니다. 이 단계가 완료되었습니다.</div>`;
  }
}

/* =====================================================================
 *  전송 (Supabase REST)
 * ===================================================================== */
function isTestMode(){ return !(CONFIG.supabase.url && CONFIG.supabase.key); }

// URL 정리: 앞뒤 공백 제거, https:// 누락 보정, 끝의 / 나 /rest/v1 제거
function baseUrl(){
  let u = String(CONFIG.supabase.url || "").trim();
  if (u && !/^https?:\/\//i.test(u)) u = "https://" + u;
  u = u.replace(/\/rest\/v1\/?$/i, "").replace(/\/+$/, "");
  return u;
}
function restUrl(){ return baseUrl() + "/rest/v1/"; }
function apiKey(){ return String(CONFIG.supabase.key || "").trim(); }

// 키 전달 방식 두 가지:
//   header: 표준 방식. apikey 헤더에 키를 넣음
//   query : 일부 기관 네트워크가 apikey 헤더를 제거하는 경우를 위한 우회. 주소 뒤에 ?apikey=… 로 넣음
function withKey(url){ return url + (url.includes("?") ? "&" : "?") + "apikey=" + encodeURIComponent(apiKey()); }
function keyedUrl(url, mode){ return mode === "query" ? withKey(url) : url; }
function keyedHeaders(mode, extra){ return Object.assign(mode === "query" ? {} : { "apikey": apiKey() }, extra || {}); }

async function readDetail(res){
  try { const j = await res.json(); return j.message || j.hint || JSON.stringify(j); } catch (_) { return ""; }
}

// 점검 주소: 응답 테이블 자체. (/rest/v1/ 루트는 publishable 키로 열 수 없음)
function probeUrl(){ return restUrl() + "rpc/ahp_login"; }

async function probe(mode){
  // 빈 이름·비밀번호로 로그인 함수를 불러 봄: {"ok":false,"error":"bad_credentials"} 가 오면 키·주소·함수 모두 정상
  const res = await fetch(keyedUrl(probeUrl(), mode), { method: "POST", headers: keyedHeaders(mode, { "Content-Type": "application/json" }), body: JSON.stringify({ p_name: "", p_password: "" }) });
  if (res.ok) return { ok: true, status: res.status, detail: "" };
  const detail = await readDetail(res);
  if (res.status === 404 && /ahp_login/.test(detail)) return { ok: false, status: res.status, detail: "서버에 로그인 함수가 없습니다. supabase_update_all.sql 을 실행해 주세요." };
  return { ok: false, status: res.status, detail };
}

// 페이지를 열 때 Supabase 연결을 미리 확인 (30쌍을 다 응답한 뒤에 실패하지 않도록)
async function checkConnection(){
  const el = $("#connBanner");
  if (isTestMode()) return;
  let a = null, b = null;
  try {
    a = await probe("header");
    if (a.ok){ state.keyMode = "header"; return; }
    b = await probe("query");
    if (b.ok){ state.keyMode = "query"; console.info("apikey 헤더가 차단되어 주소 방식으로 전송합니다."); return; }
  } catch (e) {
    el.hidden = false;
    el.innerHTML = `<b>연결 불가</b>: 응답 저장 서버(<code>${esc(restUrl())}</code>)에 접속할 수 없습니다.
      주소가 정확한지, 또는 현재 네트워크(기관 방화벽 등)가 supabase.co 접속을 막고 있지 않은지 확인해 주세요.
      이 상태로도 설문은 진행할 수 있으며, 제출 시 응답 파일을 내려받아 담당자에게 보낼 수 있습니다.`;
    return;
  }
  const fmt = p => `HTTP ${p.status}${p.detail ? " " + esc(p.detail) : ""}`;
  el.hidden = false;
  el.innerHTML = `<b>설정 오류</b>: 응답 저장 서버 주소는 열리지만 키가 거부되었습니다.
    헤더 방식: ${fmt(a)} / 주소 방식: ${fmt(b)}.<br>
    <a href="${esc(withKey(probeUrl()))}" target="_blank" rel="noopener">이 링크</a>를 새 탭에서 열었을 때
    “permission denied for table …”이 보이면 키는 정상이고 네트워크 문제이며, “Invalid API key”가 보이면
    프로젝트 <code>${esc(baseUrl().replace(/^https?:\/\//, "").split(".")[0])}</code>의 Settings → API Keys에서 키를 다시 확인해야 합니다.
    “Could not find the function”이 보이면 supabase_update4.sql이 이 프로젝트에서 실행되지 않은 것입니다.`;
}

function buildPayload(){
  const { res, rows } = computeAll();
  const cr = {}; SECTIONS.forEach(s => cr[s.id] = round(res[s.id].CR, 4));
  const judgments = [];
  for (const s of SECTIONS){
    const r = res[s.id];
    for (const [i, j] of pairsOf(s.items.length)){
      const a = state.answers[s.id][i + "-" + j];
      judgments.push({ tree: s.tree, section_id: s.id, section: s.short, left_item: s.items[i], right_item: s.items[j],
                       value: round(r.A[i][j], 4), choice: a.side === "E" ? "1" : a.side + a.val });
    }
  }
  return {
    submission_id: state.submissionId,
    mineral: state.mineral,
    submitted_at: new Date().toISOString(),
    affiliation: state.respondent.affiliation || "",
    name: state.respondent.name || "",
    duration_sec: Math.round((Date.now() - state.startedAt) / 1000),
    scale: SCALE.join(","),
    cr,
    weights: rows.map(x => ({ ...x, local_w: round(x.local_w, 5), global_w: round(x.global_w, 5), cr: round(x.cr, 4) })),
    judgments,
    answers: state.answers
  };
}

async function sendToSupabase(row){
  if (!account.token) return { ok: false, error: "로그인이 필요합니다. 안내 화면에서 다시 로그인해 주세요." };
  try {
    const r = await rpc("ahp_submit", { p_token: account.token, p_row: row });
    if (r.ok) return r;
    if (r.error === "invalid_session"){ logout(true); return { ok: false, error: errText(r.error) }; }
    return { ok: false, error: errText(r.error) };
  } catch (e) {
    return { ok: false, error: `${e.message || e}. 주소가 열리지 않거나 네트워크가 차단된 상태입니다.` };
  }
}

async function submitAll(){
  const btn = $("#submitBtn"), msg = $("#submitMsg");
  btn.disabled = true; btn.textContent = "전송 중…";
  const payload = buildPayload();
  state.lastPayload = payload;
  clearTimeout(saveTimer); savePending = false;
  const res = await sendToSupabase(payload);
  if (res.ok){ renderDone({ ...res, payload }); return; }
  btn.disabled = false; btn.textContent = "다시 제출";
  msg.innerHTML = `<div class="cr-box err"><div class="cr-val">전송에 실패했습니다</div>
    <div class="cr-msg">${esc(res.error)}<br>네트워크를 확인한 뒤 다시 시도해 주세요. 반복되면
    <a href="#" onclick="downloadJSON();return false;">응답 파일을 내려받아</a> 설문 담당자에게 보내 주세요.</div></div>`;
}

function downloadJSON(){
  const payload = state.lastPayload || buildPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ahp_${payload.mineral || ""}_${payload.submission_id}.json`;
  a.click();
}

$("#title").textContent = CONFIG.title;
$("#testBanner").hidden = !isTestMode();
render();
checkConnection();
autoLogin();
</script>
