<!DOCTYPE html>
<html lang="ko">
<head>

<title>자원안보 진단·평가 지표 AHP 전문가 설문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0/dotum.min.css">
<style>

    --ink:#111; --line:#bfbfbf; --line-dark:#111; --soft:#f2f2f2;
    --green:#3A7D44; --red:#C0504D; --green-bg:#f1f8f2; --red-bg:#fdf3f3;

  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);

  .steps span.active{background:var(--line-dark);color:#fff;border-color:var(--line-dark)}
  .steps span.link{cursor:pointer}
  .steps span.link:hover{border-color:var(--line-dark);background:var(--soft)}
  .steps span.active.link:hover{background:var(--line-dark);color:#fff}
  .steps span.off{border-style:dashed;cursor:default}
  .steps span.sep{border:0;padding:4px 2px;color:var(--line)}
  .card{border:1px solid var(--line);padding:20px 22px;margin-bottom:16px;background:#fff}
  h2{font-size:18px;margin:0 0 10px}
  h3{font-size:15px;margin:18px 0 8px}
  p{margin:0 0 10px}

  /* 계층구조 */

  .fields label{display:block;font-size:13px;margin-bottom:4px}

<body>
<div class="wrap">

<script>
/* =====================================================================
 *  설정 — 이 블록만 수정하면 설문 내용을 바꿀 수 있습니다
 * ===================================================================== */
const CONFIG = {
  // Supabase 프로젝트 설정. 둘 중 하나라도 비어 있으면 테스트 모드로 동작합니다.
  supabase: {
    url: "https://ocigorjuluhoylpnthbi.supabase.co",   // 반드시 https:// 로 시작 (빠뜨려도 자동 보정됨)
    key: "sb_publishable_nhyra74QzDf3WCkbqZW3LA_sGEd9Tca"   // Project Settings → API Keys 의 publishable 키
  },
  table: "ahp_responses",

  crLimit: 0.2,   // 이 값을 초과하면 오류 → 재검토 요청, 다음 단계 진행 불가
  crWarn:  0.1,   // 이 값을 초과하면 주의 표시 (진행은 가능)
  showHint: true, // CR 초과 시 가장 어긋난 비교를 붉게 표시

  // 5점 척도. Saaty 척도의 다섯 언어적 등급(1·3·5·7·9)을 씁니다.
  // 1~5 정수 척도를 원하면 아래 두 줄을 바꾸세요:
  //   values: [1, 2, 3, 4, 5],
  //   labels: { 1:"동등하게 중요", 2:"약간 더 중요", 3:"더 중요", 4:"매우 더 중요", 5:"절대적으로 더 중요" }
  scale: {
    values: [1, 3, 5, 7, 9],
    labels: { 1:"동등하게 중요", 3:"약간 더 중요", 5:"더 중요", 7:"매우 더 중요", 9:"절대적으로 더 중요" }
  },

  organization: "에너지경제연구원 에너지안보정책연구실",
  title: "자원안보 진단·평가 지표 가중치 산정을 위한 AHP 전문가 설문",

  // 두 개의 독립된 계층. 계층 간(안정성 vs 대응력) 비교는 하지 않습니다.
  trees: [
    {
      id: "A", name: "안정성",
      areas: [
        { name: "공급",
          def: "자원의 안정적 확보 가능성을 의미하며, 공급망 차질 발생 가능성과 그 파급효과를 평가",
          items: ["자원자립도", "정치적 안정성", "수입 편향성", "생산 편향성", "국내 공급 인프라 안정성"] },
        { name: "수요",
          def: "국내 경제가 자원 사용 및 수입 의존 구조에 따라 얼마나 취약한지를 의미하며, 위기 발생 시 경제적 파급효과를 평가",
          items: ["수입 안정성", "가격 안정성", "수요산업 규모"] },
        { name: "시스템",
          def: "자원 위기 대응을 뒷받침하는 제도적·정보적 기반을 의미하며, 기반이 미흡할수록 위기 대응 취약성이 높아짐",
          items: ["정보 접근성", "공공정책 및 제도"] }
      ]
    },
    {
      id: "B", name: "대응력",
      areas: [
        { name: "상시 대응력",
          def: "평시 자원 공급 불안정성에 대비할 수 있는 역량으로, 외교적 협력, 기술적 역량, 제도적 준비 등을 통해 공급망 충격을 지속적으로 흡수·완화하는 능력을 평가",
          items: ["수입원 다변화", "외교 및 국제협력", "자원 R&D", "자원 재활용"] },
        { name: "비상 대응력",
          def: "비상시 즉각적으로 동원 가능한 자원과 수단을 의미하며, 비축·개발 물량, 긴급 조달 능력 등을 통해 공급망 위험 발생 시 즉시 대응할 수 있는 능력을 평가",
          items: ["자원개발률", "비축물량", "위기대응 숙련도"] },
        { name: "인프라",
          def: "자원 위기 대응을 뒷받침하는 제도적·물적·인적 기반을 의미하며, 대응 시스템의 구축 수준과 인적자원의 안정적 공급 능력을 평가",
          items: ["비상대응 시스템", "인적자원 공급"] }
      ]
    }
  ]
};

/* =====================================================================
 *  AHP 계산 (Saaty 고유벡터법)
 * ===================================================================== */
// === AHP MATH START ===
const RI = {1:0, 2:0, 3:0.58, 4:0.90, 5:1.12, 6:1.24, 7:1.32, 8:1.41, 9:1.45, 10:1.49,
            11:1.51, 12:1.48, 13:1.56, 14:1.57, 15:1.59};

function pairsOf(n){
  const p = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) p.push([i, j]);
  return p;
}

// judgments: { "i-j": a_ij }  (a_ij = 왼쪽/오른쪽 중요도 비율)
function buildMatrix(n, judgments){
  const A = Array.from({length: n}, () => Array(n).fill(1));
  for (const [i, j] of pairsOf(n)){
    const a = judgments[i + "-" + j];
    if (a == null) return null;
    A[i][j] = a; A[j][i] = 1 / a;
  }
  return A;
}

// 거듭제곱법으로 주고유벡터·λmax 계산
function priorityVector(A){
  const n = A.length;
  let w = Array(n).fill(1 / n);
  for (let it = 0; it < 200; it++){
    const Aw = A.map(r => r.reduce((s, a, j) => s + a * w[j], 0));
    const sum = Aw.reduce((a, b) => a + b, 0);
    const w2 = Aw.map(v => v / sum);
    const diff = Math.max(...w2.map((v, i) => Math.abs(v - w[i])));
    w = w2;
    if (diff < 1e-12) break;
  }
  const Aw = A.map(r => r.reduce((s, a, j) => s + a * w[j], 0));
  const lmax = Aw.reduce((s, v, i) => s + v / w[i], 0) / n;
  return { w, lmax };
}

function consistency(A){
  const n = A.length;
  const { w, lmax } = priorityVector(A);
  const CI = n > 2 ? (lmax - n) / (n - 1) : 0;
  const ri = RI[n] || 1.59;
  const CR = n > 2 ? CI / ri : 0;
  return { w, lmax, CI, CR };
}

// 가중치로부터 추정되는 비율과 가장 크게 어긋난 쌍
function worstPair(A, w){
  let worst = null, maxDev = -1;
  for (const [i, j] of pairsOf(A.length)){
    const dev = Math.abs(Math.log(A[i][j]) - Math.log(w[i] / w[j]));
    if (dev > maxDev){ maxDev = dev; worst = [i, j]; }
  }
  return { pair: worst, dev: maxDev };
}
// === AHP MATH END ===

/* =====================================================================
 *  계층 → 비교 단계(섹션) 전개
 * ===================================================================== */
const SECTIONS = [];
for (const t of CONFIG.trees){
  SECTIONS.push({
    id: t.id + "0", tree: t.id, treeName: t.name, level: "area", parent: null,
    title: `${t.name} 평가영역 간 상대적 중요도`, short: `${t.name} 영역`,
    desc: `${t.name} 지표를 구성하는 아래 ${t.areas.length}개 평가영역 중 어느 것이 얼마나 더 중요하다고 보십니까?`,
    items: t.areas.map(a => a.name)
  });
  t.areas.forEach((a, k) => SECTIONS.push({
    id: `${t.id}${k + 1}`, tree: t.id, treeName: t.name, level: "item", parent: a.name,
    title: `'${a.name}' 영역 세부지표 간 상대적 중요도`, short: a.name,
    desc: `${t.name} › ${a.name} 영역을 구성하는 아래 ${a.items.length}개 세부지표 중 어느 것이 얼마나 더 중요하다고 보십니까?`,
    items: a.items.slice()
  }));
}
const N_STEPS = SECTIONS.length;          // 비교 단계 수
const SCALE = CONFIG.scale.values.slice().sort((a, b) => a - b);
const LABEL = CONFIG.scale.labels;

/* =====================================================================
 *  상태
 * ===================================================================== */
const state = {
  step: 0,
  answers: {},            // answers[secId]["i-j"] = {side:'L'|'E'|'R', val}
  respondent: {},
  startedAt: Date.now(),
  submissionId: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8)
};
SECTIONS.forEach(s => state.answers[s.id] = {});

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ratioOf = a => a.side === "L" ? a.val : a.side === "R" ? 1 / a.val : 1;
const round = (x, d) => Math.round(x * 10 ** d) / 10 ** d;
const secById = id => SECTIONS.find(s => s.id === id);

function sectionResult(sec){
  const n = sec.items.length, J = {};
  for (const [i, j] of pairsOf(n)){
    const a = state.answers[sec.id][i + "-" + j];
    if (!a) return null;
    J[i + "-" + j] = ratioOf(a);
  }
  const A = buildMatrix(n, J);
  const c = consistency(A);
  return { A, ...c, worst: worstPair(A, c.w) };
}

function sectionOK(sec){
  const r = sectionResult(sec);
  return !!r && r.CR <= CONFIG.crLimit;
}

/* =====================================================================
 *  렌더링
 * ===================================================================== */
// 완료된 단계 수 / 첫 미완료 단계
const doneCount = () => SECTIONS.filter(sectionOK).length;
const allDone = () => doneCount() === N_STEPS;
const firstIncomplete = () => SECTIONS.findIndex(sec => !sectionOK(sec)) + 1;

// 단계 표시. 어느 단계든 눌러서 이동할 수 있고, 완료된 단계에는 ✓ 가 붙습니다.
// 결과·제출은 모든 단계가 완료되어야 열립니다. 제출 후에는 이동할 수 없습니다.
function renderSteps(){
  const chip = (i, label, enabled) => {
    const done = i >= 1 && i <= N_STEPS && sectionOK(SECTIONS[i - 1]);
    const cls = [i === state.step ? "active" : done ? "done" : "", enabled ? "link" : "off"].join(" ").trim();
    const on = enabled ? ` onclick="go(${i})"` : ` title="모든 단계를 완료하면 열립니다"`;
    return `<span class="${cls}"${on}>${done ? "✓ " : ""}${label}</span>`;
  };
  const nav = !state.submitted;
  let html = chip(0, "안내", nav);
  let idx = 1;
  for (const t of CONFIG.trees){
    html += `<span class="sep">|</span>`;
    for (let k = 0; k <= t.areas.length; k++, idx++){
      const label = k === 0 ? `${t.name} 영역` : t.areas[k - 1].name;
      html += chip(idx, `${idx}. ${esc(label)}`, nav);
    }
  }
  html += `<span class="sep">|</span>` + chip(N_STEPS + 1, "결과·제출", nav && allDone());
  $("#steps").innerHTML = html;
}

// 계층도 SVG
//   focus = { level:"all" }                  안내 화면: 전체를 또렷하게
//   focus = { level:"area" }                 평가영역 비교 단계: 영역 상자 강조
//   focus = { level:"item", area:"공급" }    세부지표 비교 단계: 해당 영역 경로와 세부지표 강조
function diagramSVG(tree, focus, compact){
  // compact: 폰 화면용 압축 배치 (폭 320px)
  const ROW = compact ? 24 : 26, GAP = 4, H_BOX = ROW - GAP, FS = compact ? 11 : 12.5;
  const col = compact
    ? { t:{x:4,w:54}, a:{x:84,w:82}, i:{x:188,w:130} }
    : { t:{x:8,w:78}, a:{x:142,w:104}, i:{x:304,w:184} };
  const totalRows = tree.areas.reduce((s, a) => s + a.items.length, 0);
  const H = totalRows * ROW + 12, W = col.i.x + col.i.w + 8;
  const INK = "#111", DIM = "#b5b5b5", FILL = "#e9e9e9";
  const all = focus.level === "all";
  const box = (c, y, text, on, strong) =>
    `<rect x="${c.x}" y="${y}" width="${c.w}" height="${H_BOX}" fill="${strong ? FILL : "#fff"}" stroke="${on ? INK : DIM}" stroke-width="${strong ? 1.6 : 1}"/>` +
    `<text x="${c.x + c.w / 2}" y="${y + H_BOX / 2 + 4.5}" text-anchor="middle" font-size="${FS}" fill="${on ? INK : DIM}"${strong ? ' font-weight="700"' : ""}>${esc(text)}</text>`;
  const line = (x1, y1, x2, y2, on) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${on ? INK : DIM}" stroke-width="1"/>`;

  let g = "", row = 0;
  const centers = [];
  for (const a of tree.areas){
    const onArea = all || focus.level === "area" || focus.area === a.name;
    const itemsOn = all || (focus.level === "item" && focus.area === a.name);
    const strongArea = !all && (focus.level === "area" || focus.area === a.name);
    const strongItems = !all && focus.level === "item" && focus.area === a.name;
    const y0 = 6 + row * ROW, n = a.items.length;
    const yc = y0 + (n * ROW) / 2 - GAP / 2;
    centers.push({ yc, on: onArea });
    const busX = col.a.x + col.a.w + (compact ? 10 : 14);
    const firstC = y0 + H_BOX / 2, lastC = y0 + (n - 1) * ROW + H_BOX / 2;
    g += line(col.a.x + col.a.w, yc, busX, yc, itemsOn);
    if (n > 1) g += line(busX, firstC, busX, lastC, itemsOn);
    a.items.forEach((it, k) => {
      const y = y0 + k * ROW, c = y + H_BOX / 2;
      g += line(busX, c, col.i.x, c, itemsOn);
      g += box(col.i, y, it, itemsOn, strongItems);
    });
    g += box(col.a, yc - H_BOX / 2, a.name, onArea, strongArea);
    row += n;
  }
  const tyc = H / 2 - 3, busX = col.t.x + col.t.w + (compact ? 12 : 16);
  g += line(col.t.x + col.t.w, tyc, busX, tyc, true);
  g += line(busX, centers[0].yc, busX, centers[centers.length - 1].yc, all || focus.level === "area");
  const fc = centers.find(c => c.on);
  if (!all && focus.level === "item" && fc) g += line(busX, Math.min(tyc, fc.yc), busX, Math.max(tyc, fc.yc), true);
  centers.forEach(c => g += line(busX, c.yc, col.a.x, c.yc, c.on));
  g += box(col.t, tyc - H_BOX / 2, tree.name, true, false);
  const W2 = compact ? col.i.x + col.i.w + 4 : W;
  return `<svg viewBox="0 0 ${W2} ${H}" width="${W2}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">${g}</svg>`;
}

const isCompact = () => window.innerWidth < 600;

function pairMsg(sec, i, j, a){
  if (a.side === "E") return `두 항목이 ${esc(LABEL[1] || "동등")} (1)`;
  const [m, o] = a.side === "L" ? [sec.items[i], sec.items[j]] : [sec.items[j], sec.items[i]];
  return `<b>${esc(m)}</b>이(가) ${esc(o)}보다 ${esc(LABEL[a.val] || "")} (${a.val})`;
}

function pairHTML(sec, i, j){
  const key = i + "-" + j, a = state.answers[sec.id][key];
  const btn = (side, v) =>
    `<button type="button" class="${side === "E" ? "eq" : ""} ${a && a.side === side && a.val === v ? "sel" : ""}"
       onclick="pick('${sec.id}','${key}','${side}',${v})" title="${esc(LABEL[v] || "")}">${v}</button>`;
  let btns = "";
  for (const v of SCALE.slice(1).reverse()) btns += btn("L", v);
  btns += btn("E", 1);
  for (const v of SCALE.slice(1)) btns += btn("R", v);
  return `<div class="pair" id="pair-${sec.id}-${key}">
    <div class="pair-head"><span class="l">${esc(sec.items[i])}</span><span class="r">${esc(sec.items[j])}</span></div>
    <div class="scale">
      <div class="dirs"><span>◀ 왼쪽이 더 중요</span><span>동등</span><span>오른쪽이 더 중요 ▶</span></div>
      <div class="btns">${btns}</div>
    </div>
    <div class="pair-msg">${a ? pairMsg(sec, i, j, a) : ""}</div>
  </div>`;
}

// 전체 결과: 영역 가중치 × 세부지표 가중치 = 종합 가중치
function computeAll(){
  const res = {}; SECTIONS.forEach(s => res[s.id] = sectionResult(s));
  const rows = [];
  for (const t of CONFIG.trees){
    const areaSec = secById(t.id + "0"), ar = res[areaSec.id];
    t.areas.forEach((a, k) => {
      const aw = ar.w[k];
      rows.push({ tree: t.id, tree_name: t.name, level: "area", section_id: areaSec.id, area: a.name, item: a.name,
                  local_w: aw, global_w: aw, cr: ar.CR });
      const sec = secById(`${t.id}${k + 1}`), r = res[sec.id];
      sec.items.forEach((it, i) => rows.push({
        tree: t.id, tree_name: t.name, level: "item", section_id: sec.id, area: a.name, item: it,
        local_w: r.w[i], global_w: aw * r.w[i], cr: r.CR
      }));
    });
  }
  return { res, rows };
}

function renderResults(){
  if (!allDone()){ go(N_STEPS + 1); return ""; }
  const { res, rows } = computeAll();
  const pct = x => (x * 100).toFixed(1) + "%";
  const crCls = cr => cr > CONFIG.crLimit ? "err" : cr > CONFIG.crWarn ? "warn" : "ok";
  const blocks = CONFIG.trees.map(t => {
    const areaSec = secById(t.id + "0");
    let body = "";
    t.areas.forEach((a, k) => {
      const sec = secById(`${t.id}${k + 1}`), r = res[sec.id], aw = res[areaSec.id].w[k];
      body += `<tr class="area-row"><td>${esc(a.name)}</td><td class="num">${pct(aw)}</td><td class="num">${pct(aw)}</td><td class="barcell"><div class="bar" style="width:${pct(aw)}"></div></td><td class="num">${r.CR.toFixed(3)}</td></tr>`;
      rows.filter(x => x.tree === t.id && x.level === "item" && x.area === a.name).forEach(x => {
        body += `<tr><td class="sub">${esc(x.item)}</td><td class="num">${pct(x.local_w)}</td><td class="num">${pct(x.global_w)}</td><td class="barcell"><div class="bar g" style="width:${pct(x.global_w)}"></div></td><td></td></tr>`;
      });
    });
    return `<section class="card"><h2>${esc(t.name)}</h2>
      <table><thead><tr><th>평가영역 / 세부지표</th><th class="num">영역 내 가중치</th><th class="num">종합 가중치</th><th class="barcell"></th><th class="num">세부지표 CR</th></tr></thead><tbody>${body}</tbody></table>
      <div class="cr-box ${crCls(res[areaSec.id].CR)} slim"><div class="cr-val">평가영역 비교 CR = ${res[areaSec.id].CR.toFixed(3)}</div>
        <div class="cr-msg">종합 가중치 = 평가영역 가중치 × 영역 내 세부지표 가중치. ${esc(t.name)} 체계 안에서 세부지표 종합 가중치의 합은 100%입니다.</div></div>
      </section>`;
  }).join("");
  const testNote = isTestMode() ? `<p class="note">테스트 모드: Supabase 설정이 비어 있어 응답이 전송되지 않습니다. 제출을 누르면 전송될 데이터가 화면에 표시됩니다.</p>` : "";
  return `${blocks}
  <section class="card">
    <h2>제출</h2>
    <p>위 가중치는 응답하신 쌍대비교로부터 산출된 값입니다. 확인 후 제출해 주세요.</p>
    ${testNote}
    <div class="nav">
      <button class="ghost" onclick="go(${N_STEPS})">이전</button>
      <button class="primary" id="submitBtn" onclick="submitAll()">제출</button>
    </div>
    <div id="submitMsg"></div>
  </section>`;
}

function renderDone(res){
  $("#main").innerHTML = `<section class="card">
    <h2>${res.test ? "테스트 완료" : "제출 완료"}</h2>
    <p>${res.test
      ? "테스트 모드이므로 실제 전송은 하지 않았습니다. 아래는 Supabase 테이블에 한 행으로 기록될 데이터입니다."
      : "응답해 주셔서 감사합니다. 응답이 정상적으로 기록되었습니다."}</p>
    ${res.duplicate ? `<p class="note">이미 기록된 응답이라 중복 저장하지 않았습니다.</p>` : ""}
    ${res.test ? `<pre class="json">${esc(JSON.stringify(res.payload, null, 2))}</pre>
                  <button class="ghost" onclick="downloadJSON()">JSON 내려받기</button>` : ""}
  </section>`;
  state.step = N_STEPS + 2;
  state.submitted = true;
  renderSteps();
}

function render(){
  renderSteps();
  const m = $("#main"), k = state.step;
  if (k === 0) m.innerHTML = renderIntro();
  else if (k <= N_STEPS){ m.innerHTML = renderSection(k); updateCR(SECTIONS[k - 1]); }
  else m.innerHTML = renderResults();
}

/* =====================================================================
 *  상호작용
 * ===================================================================== */
function readRespondent(){
  const g = id => document.getElementById(id);
  if (!g("affiliation")) return true;
  state.respondent = { affiliation: g("affiliation").value.trim(), name: g("name").value.trim() };
  const missing = [!state.respondent.affiliation && "소속", !state.respondent.name && "이름"].filter(Boolean);
  const msg = g("respMsg");
  if (missing.length){
    msg.innerHTML = `<div class="cr-box err slim"><div class="cr-msg">${missing.join("과 ")}을(를) 입력해 주세요.</div></div>`;
    g(missing[0] === "소속" ? "affiliation" : "name").focus();
    return false;
  }
  msg.innerHTML = "";
  return true;
}

function go(step){
  if (state.submitted) return;
  if (state.step === 0 && step > 0 && !readRespondent()) return;
  if (step > N_STEPS && !allDone()){                   // 결과·제출은 모든 단계 완료 후에만
    const left = N_STEPS - doneCount();
    state.notice = `아직 완료하지 않은 단계가 ${left}개 있습니다. 모든 단계를 완료하면 결과를 확인하고 제출할 수 있습니다.`;
    step = firstIncomplete();
  }
  state.step = step;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function pick(secId, key, side, val){
  state.answers[secId][key] = { side, val };
  const sec = secById(secId);
  const [i, j] = key.split("-").map(Number);
  document.getElementById(`pair-${secId}-${key}`).outerHTML = pairHTML(sec, i, j);
  updateCR(sec);
}

function updateCR(sec){
  const box = $("#crbox");
  if (!box) return;
  renderSteps();                                       // 완료 표시(✓) 즉시 갱신
  document.querySelectorAll(".pair.worst").forEach(e => e.classList.remove("worst"));
  document.querySelectorAll(".worst-note").forEach(e => e.remove());

  const total = pairsOf(sec.items.length).length;
  const done = Object.keys(state.answers[sec.id]).length;
  const r = sectionResult(sec);

  if (!r){
    box.className = "cr-box";
    box.innerHTML = `<div class="cr-val">일관성 비율(CR): –</div>
      <div class="cr-msg">${done} / ${total} 쌍 응답 완료. 모든 쌍을 응답하면 자동으로 계산됩니다.</div>`;
    return;
  }
  if (sec.items.length < 3){
    box.className = "cr-box ok";
    box.innerHTML = `<div class="cr-val">✓ 응답 완료</div>
      <div class="cr-msg">항목이 2개인 비교는 일관성 검증 대상이 아닙니다. 이 단계가 완료되었습니다.</div>`;
    return;
  }

  const cr = r.CR;
  if (cr > CONFIG.crLimit){
    box.className = "cr-box err";
    box.innerHTML = `<div class="cr-val">⚠ 일관성 비율(CR) = ${cr.toFixed(3)} — 기준치 ${CONFIG.crLimit} 초과</div>
      <div class="cr-msg">응답 간 논리적 일관성이 낮습니다 (예: A &gt; B, B &gt; C인데 C &gt; A).
        ${CONFIG.showHint ? "붉게 표시된 비교를 중심으로" : "각 비교를"} 다시 검토해 주세요.
        CR이 ${CONFIG.crLimit} 이하가 되어야 이 단계가 완료됩니다.</div>`;
    if (CONFIG.showHint && r.worst.pair){
      const [i, j] = r.worst.pair;
      const pe = document.getElementById(`pair-${sec.id}-${i}-${j}`);
      pe.classList.add("worst");
      pe.insertAdjacentHTML("beforeend",
        `<div class="worst-note">이 비교가 다른 응답들과 가장 크게 어긋납니다.</div>`);
    }
    box.scrollIntoView({ behavior: "smooth", block: "center" });
  } else if (cr > CONFIG.crWarn){
    box.className = "cr-box warn";
    box.innerHTML = `<div class="cr-val">일관성 비율(CR) = ${cr.toFixed(3)}</div>
      <div class="cr-msg">허용범위(≤ ${CONFIG.crLimit}) 안에 있으나 일반적 기준(0.1)보다는 높습니다.
        가능하면 한 번 더 검토해 주세요. 이 단계는 완료되었습니다.</div>`;
  } else {
    box.className = "cr-box ok";
    box.innerHTML = `<div class="cr-val">✓ 일관성 비율(CR) = ${cr.toFixed(3)}</div>
      <div class="cr-msg">응답의 일관성이 양호합니다. 이 단계가 완료되었습니다.</div>`;
  }
}

/* =====================================================================
 *  전송 (Supabase REST)
 * ===================================================================== */
function isTestMode(){ return !(CONFIG.supabase.url && CONFIG.supabase.key); }

// URL 정리: 앞뒤 공백 제거, https:// 누락 보정, 끝의 / 나 /rest/v1 제거
function baseUrl(){
  let u = String(CONFIG.supabase.url || "").trim();
  if (u && !/^https?:\/\//i.test(u)) u = "https://" + u;
  u = u.replace(/\/rest\/v1\/?$/i, "").replace(/\/+$/, "");
  return u;
}
function restUrl(){ return baseUrl() + "/rest/v1/"; }
function apiKey(){ return String(CONFIG.supabase.key || "").trim(); }

// 키 전달 방식 두 가지:
//   header — 표준 방식. apikey 헤더에 키를 넣음
//   query  — 일부 기관 네트워크가 apikey 헤더를 제거하는 경우를 위한 우회. 주소 뒤에 ?apikey=… 로 넣음
function withKey(url){ return url + (url.includes("?") ? "&" : "?") + "apikey=" + encodeURIComponent(apiKey()); }
function keyedUrl(url, mode){ return mode === "query" ? withKey(url) : url; }
function keyedHeaders(mode, extra){ return Object.assign(mode === "query" ? {} : { "apikey": apiKey() }, extra || {}); }

async function readDetail(res){
  try { const j = await res.json(); return j.message || j.hint || JSON.stringify(j); } catch (_) { return ""; }
}

// 점검 주소: 응답 테이블 자체. (/rest/v1/ 루트는 publishable 키로 열 수 없음)
function probeUrl(){ return restUrl() + CONFIG.table + "?select=submission_id&limit=1"; }

async function probe(mode){
  const res = await fetch(keyedUrl(probeUrl(), mode), { headers: keyedHeaders(mode) });
  if (res.ok) return { ok: true, status: res.status, detail: "" };
  const detail = await readDetail(res);
  // 익명 키는 삽입만 허용되어 조회는 거부되지만, 이 거부는 데이터베이스까지 도달했다는 뜻 → 키·주소·네트워크 모두 정상
  if ((res.status === 401 || res.status === 403) && /permission denied|42501/i.test(detail))
    return { ok: true, status: res.status, detail };
  return { ok: false, status: res.status, detail };
}

// 페이지를 열 때 Supabase 연결을 미리 확인 (30쌍을 다 응답한 뒤에 실패하지 않도록)
async function checkConnection(){
  const el = $("#connBanner");
  if (isTestMode()) return;
  let a = null, b = null;
  try {
    a = await probe("header");
    if (a.ok){ state.keyMode = "header"; return; }
    b = await probe("query");
    if (b.ok){ state.keyMode = "query"; console.info("apikey 헤더가 차단되어 주소 방식으로 전송합니다."); return; }
  } catch (e) {
    el.hidden = false;
    el.innerHTML = `<b>연결 불가</b> — 응답 저장 서버(<code>${esc(restUrl())}</code>)에 접속할 수 없습니다.
      주소가 정확한지, 또는 현재 네트워크(기관 방화벽 등)가 supabase.co 접속을 막고 있지 않은지 확인해 주세요.
      이 상태로도 설문은 진행할 수 있으며, 제출 시 응답 파일을 내려받아 담당자에게 보낼 수 있습니다.`;
    return;
  }
  const fmt = p => `HTTP ${p.status}${p.detail ? " " + esc(p.detail) : ""}`;
  el.hidden = false;
  el.innerHTML = `<b>설정 오류</b> — 응답 저장 서버 주소는 열리지만 키가 거부되었습니다.
    헤더 방식: ${fmt(a)} / 주소 방식: ${fmt(b)}.<br>
    <a href="${esc(withKey(probeUrl()))}" target="_blank" rel="noopener">이 링크</a>를 새 탭에서 열었을 때
    “permission denied for table …”이 보이면 키는 정상이고 네트워크 문제이며, “Invalid API key”가 보이면
    프로젝트 <code>${esc(baseUrl().replace(/^https?:\/\//, "").split(".")[0])}</code>의 Settings → API Keys에서 키를 다시 확인해야 합니다.
    “Could not find the table”이 보이면 supabase.sql이 이 프로젝트에서 실행되지 않은 것입니다.`;
}

function buildPayload(){
  const { res, rows } = computeAll();
  const cr = {}; SECTIONS.forEach(s => cr[s.id] = round(res[s.id].CR, 4));
  const judgments = [];
  for (const s of SECTIONS){
    const r = res[s.id];
    for (const [i, j] of pairsOf(s.items.length)){
      const a = state.answers[s.id][i + "-" + j];
      judgments.push({ tree: s.tree, section_id: s.id, section: s.short, left_item: s.items[i], right_item: s.items[j],
                       value: round(r.A[i][j], 4), choice: a.side === "E" ? "1" : a.side + a.val });
    }
  }
  return {
    submission_id: state.submissionId,
    submitted_at: new Date().toISOString(),
    affiliation: state.respondent.affiliation || "",
    name: state.respondent.name || "",
    duration_sec: Math.round((Date.now() - state.startedAt) / 1000),
    user_agent: navigator.userAgent,
    scale: SCALE.join(","),
    cr,
    weights: rows.map(x => ({ ...x, local_w: round(x.local_w, 5), global_w: round(x.global_w, 5), cr: round(x.cr, 4) })),
    judgments,
    answers: state.answers
  };
}

async function postRow(row, mode){
  const url = keyedUrl(restUrl() + CONFIG.table, mode);
  const res = await fetch(url, {
    method: "POST",
    headers: keyedHeaders(mode, { "Content-Type": "application/json", "Prefer": "return=minimal" }),
    body: JSON.stringify(row)
  });
  if (res.ok) return { ok: true, mode };
  if (res.status === 409) return { ok: true, duplicate: true, mode };   // 같은 submission_id 재전송
  const detail = await readDetail(res);
  const hint = res.status === 401 || res.status === 403 ? " (키 또는 삽입 권한 정책 문제)"
             : res.status === 404 ? " (주소 또는 테이블 이름 문제)" : "";
  return { ok: false, status: res.status, error: `HTTP ${res.status} ${detail}${hint}` };
}

async function sendToSupabase(row){
  // 사전 점검에서 정해진 방식을 먼저 쓰고, 키 거부(401/403)면 다른 방식으로 한 번 더 시도
  const modes = state.keyMode === "query" ? ["query", "header"] : ["header", "query"];
  let last = null;
  for (const mode of modes){
    try {
      const r = await postRow(row, mode);
      if (r.ok){ state.keyMode = mode; return r; }
      last = r;
      if (!(r.status === 401 || r.status === 403)) break;   // 키 문제가 아니면 재시도 의미 없음
    } catch (e) {
      return { ok: false, error: `${e.message || e} — 요청 주소: ${restUrl() + CONFIG.table}. 주소가 열리지 않거나 네트워크가 차단된 상태입니다.` };
    }
  }
  return last;
}

async function submitAll(){
  const btn = $("#submitBtn"), msg = $("#submitMsg");
  btn.disabled = true; btn.textContent = "전송 중…";
  const payload = buildPayload();
  state.lastPayload = payload;
  if (isTestMode()){ renderDone({ ok: true, test: true, payload }); return; }
  const res = await sendToSupabase(payload);
  if (res.ok){ renderDone({ ...res, payload }); return; }
  btn.disabled = false; btn.textContent = "다시 제출";
  msg.innerHTML = `<div class="cr-box err"><div class="cr-val">전송에 실패했습니다</div>
    <div class="cr-msg">${esc(res.error)}<br>네트워크를 확인한 뒤 다시 시도해 주세요. 반복되면
    <a href="#" onclick="downloadJSON();return false;">응답 파일을 내려받아</a> 설문 담당자에게 보내 주세요.</div></div>`;
}

function downloadJSON(){
  const payload = state.lastPayload || buildPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ahp_${payload.submission_id}.json`;
  a.click();
}

/* =====================================================================
 *  시작
 * ===================================================================== */
$("#org").textContent = CONFIG.organization;
$("#title").textContent = CONFIG.title;
$("#testBanner").hidden = !isTestMode();
render();
checkConnection();
</script>
</body>
